[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vaso"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vaso = "vaso.cli:main"

[tool.setuptools.packages.find]
where = ["insula/execution"]
include = ["vaso*"]

[tool.pytest.ini_options]
# Tests sit beside the code they cover (x_test.py). Foundry native tests run
# under Bazel; host orchestration suites are listed explicitly below.
# Compatibility paths are excluded to collect each test once.
# third_party/ is vendored code: only its own pin check is a
# test path, so the crates' bundled Python tests are never collected.
testpaths = [
    "insula/execution",
    "insula/estate",
    "insula/rootfs",
    "tools",
    "harness/packaging_test.py",
    "harness/smoke",
    "scripts/release",
    "third_party/rust_pyo3_cargo/vendor_pin_test.py",
    "foundry/tools/build_inputs_test.py",
    "foundry/tools/build_artifacts_test.py",
    "foundry/tools/build_session_test.py",
    "foundry/tools/build_progress_test.py",
    "foundry/tools/build_report_test.py",
    "foundry/tools/build_variants_test.py",
    "foundry/tools/insula_context_test.py",
    "foundry/tools/result_test.py",
    "foundry/tools/solve_diagnostics_test.py",
]
python_files = ["*_test.py", "test_*.py"]
addopts = ["--import-mode=importlib"]
pythonpath = ["insula/execution"]
