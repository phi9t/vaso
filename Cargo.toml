[workspace]
resolver = "2"
members = [
  "crates/insula-types",
]
# Operator tool with its own lockfile; builds offline without the workspace deps.
exclude = ["crates/autoland-tui"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
camino = { version = "1.1", features = ["serde1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
