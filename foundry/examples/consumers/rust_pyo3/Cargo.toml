[package]
name = "vaso-rust-pyo3"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "vaso_rust_pyo3_ext"
crate-type = ["cdylib"]

[dependencies]
memmap2 = "=0.9.5"
pyo3 = { version = "=0.24.2", features = ["abi3-py313", "extension-module"] }
regex = "=1.11.1"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.137"
